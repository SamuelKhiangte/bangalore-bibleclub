<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A7C59"/>
      <stop offset="100%" stop-color="#2D583B"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EFE9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E9F7C"/>
      <stop offset="100%" stop-color="#4A7C59"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1C2920" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Center Open Bible Graphic -->
  <g filter="url(#shadow)" transform="translate(76, 116)">
    <!-- Book Left Page -->
    <path d="M180 220 C130 195 60 195 10 205 L10 40 C60 30 130 30 180 55 Z" fill="url(#bookGrad)"/>
    <!-- Book Right Page -->
    <path d="M180 220 C230 195 300 195 350 205 L350 40 C300 30 230 30 180 55 Z" fill="url(#bookGrad)"/>
    
    <!-- Spine center shadow -->
    <path d="M176 52 L184 52 L184 224 L176 224 Z" fill="#CAD7CD"/>

    <!-- Left Page text lines -->
    <line x1="40" y1="75" x2="150" y2="75" stroke="#788E7E" stroke-width="6" stroke-linecap="round"/>
    <line x1="40" y1="105" x2="150" y2="105" stroke="#788E7E" stroke-width="6" stroke-linecap="round"/>
    <line x1="40" y1="135" x2="130" y2="135" stroke="#788E7E" stroke-width="6" stroke-linecap="round"/>
    <line x1="40" y1="165" x2="110" y2="165" stroke="#788E7E" stroke-width="6" stroke-linecap="round"/>

    <!-- Right Page text lines -->
    <line x1="210" y1="75" x2="320" y2="75" stroke="#788E7E" stroke-width="6" stroke-linecap="round"/>
    <line x1="210" y1="105" x2="320" y2="105" stroke="#788E7E" stroke-width="6" stroke-linecap="round"/>
    <line x1="210" y1="135" x2="290" y2="135" stroke="#788E7E" stroke-width="6" stroke-linecap="round"/>
    <line x1="210" y1="165" x2="270" y2="165" stroke="#788E7E" stroke-width="6" stroke-linecap="round"/>

    <!-- Bookmark ribbon -->
    <path d="M174 45 L174 200 L180 190 L186 200 L186 45 Z" fill="#3B6948"/>
  </g>

  <!-- Cross / Sparkle Star in top center -->
  <g transform="translate(256, 92)">
    <circle cx="0" cy="0" r="16" fill="rgba(255,255,255,0.2)"/>
    <path d="M0 -22 L0 22 M-14 -6 L14 -6" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
